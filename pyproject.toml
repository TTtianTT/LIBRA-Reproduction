[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-simulation-reproduction"
version = "0.1.0"
description = "Local simulation reproduction of LIBRA (IC2E 2021)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
ml = ["scikit-learn>=1.3,<2"]
rl = ["gymnasium>=1.0,<2", "scikit-learn>=1.3,<2", "stable-baselines3>=2.4,<3"]

[tool.setuptools.packages.find]
include = ["libra_sim*", "libra_validation*", "libra_ml*", "libra_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
